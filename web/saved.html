<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="page.title">AtomSpectra · Файлы</title>
<style>
:root{ --accent:#34d3c0; --accent-dim:rgba(52,211,192,.12); --bg:#0a0c0a; --panel:#11150f; --bd:#20281e; --dim:#8a9686; --txt:#cfd6cd; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; background:var(--bg); }
body{ color:var(--txt); font-family:ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono',Consolas,monospace; padding-bottom:28px; }
a{ color:inherit; text-decoration:none; }
button,input,select{ font-family:inherit; }
.wrap{ max-width:none; margin:0; padding:18px 22px 0; display:flex; flex-direction:column; gap:14px; }
@media (max-width:600px){ .wrap{ padding:14px 16px 0 } header{ padding:12px 16px; gap:10px } }
header{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 24px; border-bottom:1px solid #1c241c; }
.brand{ display:flex; align-items:center; gap:13px; font-weight:700; font-size:16px; color:#e8efe2; }
.logo{ width:34px; height:34px; border-radius:8px; background:#10140f; border:1px solid #283226; display:flex; align-items:center; justify-content:center; position:relative; }
.logo i{ width:15px; height:15px; border-radius:50%; border:2px solid var(--accent); }
.logo b{ position:absolute; width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
.chips{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.chip{ background:#10140f; border:1px solid #243024; border-radius:999px; padding:6px 12px; font-size:11.5px; color:var(--dim); }
.chip.ok{ color:#aeb6a8; display:flex; align-items:center; gap:7px; }
.chip.warn{ color:#f0c45a; border-color:rgba(240,180,60,.35); }
#batt-chip{ display:inline-flex; align-items:center; }   /* #PWR-8 */
.chip.btn{ cursor:pointer; color:var(--accent); border-color:rgba(52,211,192,.4); }
#langBtn{ padding:3px 8px; font-size:10.5px; line-height:1.2; min-width:28px; text-align:center; }
.dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 7px var(--accent); }
.dot.off{ background:#5b655a; box-shadow:none; }
nav{ display:flex; align-items:center; gap:2px; padding:0 20px; border-bottom:1px solid #1c241c; overflow-x:auto; }
nav a,nav span{ padding:12px 16px; font-size:13px; color:var(--dim); flex-shrink:0; white-space:nowrap; }
nav .on{ font-weight:600; color:#e8efe2; border-bottom:2px solid var(--accent); }
.panel{ background:var(--panel); border:1px solid var(--bd); border-radius:10px; min-width:0; }
.pad{ padding:13px 16px; }
.btn{ border-radius:8px; padding:8px 13px; font-size:12.5px; cursor:pointer; background:#161b14; border:1px solid #2a322a; color:var(--txt); display:inline-block; }
.btn.sm{ padding:6px 10px; font-size:11.5px; }
.btn.green{ background:var(--accent-dim); border-color:rgba(52,211,192,.5); color:var(--accent); font-weight:600; }
.btn.red{ background:rgba(240,90,80,.07); border-color:rgba(240,90,80,.45); color:#ff8a82; }
.btn:hover:not(:disabled){ filter:brightness(1.2); }
.btn:disabled{ opacity:.45; cursor:default; }
.bar{ height:8px; border-radius:4px; background:#1b211a; overflow:hidden; }
.bar > i{ display:block; height:100%; border-radius:4px; transition:width .3s,background .3s; }
.lbl{ font-size:11.5px; color:#6b756a; }
.stor .hd{ display:flex; justify-content:space-between; gap:10px; font-size:12px; margin-bottom:5px; color:#aeb6a8; flex-wrap:wrap; }
.stor .hd b{ color:var(--accent); font-weight:600; }
/* папки */
.tabs{ display:flex; gap:6px; flex-wrap:wrap; }
.tab{ border-radius:8px; padding:7px 12px; font-size:12px; cursor:pointer; background:#10140f; border:1px solid #243024; color:var(--dim); white-space:nowrap; }
.tab b{ font-weight:400; color:#6b756a; margin-left:6px; }
.tab.on{ background:var(--accent-dim); border-color:rgba(52,211,192,.5); color:var(--accent); font-weight:600; }
.tab.on b{ color:var(--accent); }
.tab.off{ opacity:.45; cursor:default; }
.grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.35fr); gap:14px; align-items:start; }
@media (max-width:1100px){ .grid{ grid-template-columns:1fr } }
/* список */
.tools{ display:flex; gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid #1b211a; flex-wrap:wrap; }
.tools input[type=text]{ flex:1; min-width:120px; background:#0c0f0b; border:1px solid #2a322a; border-radius:7px; color:var(--txt); padding:6px 9px; font-size:12px; }
.tools select{ background:#0c0f0b; border:1px solid #2a322a; border-radius:7px; color:var(--txt); padding:6px 6px; font-size:12px; }
.ck{ width:16px; height:16px; accent-color:var(--accent); cursor:pointer; flex-shrink:0; margin:0; }
.list{ max-height:640px; overflow:auto; }
.row{ display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid #1b211a; cursor:pointer; }
.row:hover{ background:#161b14; }
.row.on{ background:var(--accent-dim); box-shadow:inset 3px 0 0 var(--accent); }
.row.sel .nm{ color:#e8efe2; }
.row .nm{ flex:1; min-width:0; font-size:12.5px; color:#cfd6cd; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .sub{ font-size:11px; color:#6b756a; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .busy{ color:#f0c45a; }
.ic{ border:1px solid transparent; background:none; color:#7c887c; border-radius:6px; padding:4px 7px; font-size:13px; cursor:pointer; flex-shrink:0; line-height:1; }
.ic:hover{ border-color:#2a322a; color:#e8efe2; }
.ic.del:hover{ color:#ff8a82; border-color:rgba(240,90,80,.45); }
.ic:disabled{ opacity:.3; cursor:default; }
.more{ padding:10px; text-align:center; }
.selbar{ display:flex; align-items:center; gap:8px; padding:10px 12px; border-top:1px solid #1b211a; flex-wrap:wrap; }
.selbar .lbl{ flex:1; min-width:140px; }
.empty{ color:#5b655a; font-style:italic; padding:24px; text-align:center; font-size:13px; }
/* просмотр */
.title{ font-size:14px; font-weight:600; color:#e8efe2; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
.title > span:first-child{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.title .lbl{ font-weight:400; flex-shrink:0; }
canvas{ display:block; width:100%; height:auto; background:#0c0f0b; border-radius:6px; border:1px solid var(--bd); }
.meta{ display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; font-size:12px; }
.meta .k{ color:#7c887c; } .meta .v{ color:#dfe5dc; text-align:right; overflow-wrap:anywhere; }
.actions{ display:flex; flex-wrap:wrap; gap:8px; padding:10px 14px; border-top:1px solid #1b211a; }
pre.txt{ margin:0; padding:12px; background:#0c0f0b; border:1px solid var(--bd); border-radius:6px; font-size:11.5px; line-height:1.45; color:#cfd6cd; max-height:460px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; }
.prog{ padding:40px 16px; text-align:center; color:#8a9686; font-size:12.5px; }
.note{ font-size:11.5px; color:#6b756a; padding:0 16px 12px; line-height:1.5; }
</style>
</head>
<body>

<div class="brand"><span class="logo"><i></i><b></b></span>AtomSpectra <span style="color:var(--accent)">&nbsp;Gateway</span></div>

</section>
</div>

</div>

var LANG=(function(){try{return localStorage.getItem("aswf-lang")||"ru";}catch(e){return"ru";}})();
function t(k){var d=DICT[LANG]||DICT.ru;return(d[k]!==undefined)?d[k]:(DICT.ru[k]||k);}
function tfmt(k){var s=t(k);for(var i=1;i<arguments.length;i++)s=s.replace("%"+i,arguments[i]);return s;}
function lcl(){return LANG==="ru"?"ru-RU":"en-US";}
function applyI18n(){
 document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=t(el.getAttribute("data-i18n"));});
 document.querySelectorAll("[data-i18n-ph]").forEach(function(el){el.placeholder=t(el.getAttribute("data-i18n-ph"));});
 document.title=t("page.title");
 document.documentElement.lang=LANG;
 var b=document.getElementById("langBtn"); if(b)b.textContent=(LANG==="ru")?"EN":"RU";
 document.getElementById("ckAll").title=t("ck.all");
 document.getElementById("btnReload").title=t("btn.reload");
}
function setLang(l){
 if(l!=="ru"&&l!=="en")l="ru";
 LANG=l; try{localStorage.setItem("aswf-lang",l);}catch(e){}
 applyI18n(); renderTabs(); renderStorage(); renderList();
 if(pv)openFile(pv.name,true);
}

/* ---------- состояние ---------- */

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmtSize(b){if(b<1024)return b+" B";if(b<1048576)return(b/1024).toFixed(b<10240?1:0)+" KB";if(b<1073741824)return(b/1048576).toFixed(b<10485760?1:0)+" MB";return(b/1073741824).toFixed(1)+" GB";}
function fmtDate(ts){return ts>0?new Date(ts*1000).toLocaleString(lcl()):"—";}
function fmtNum(n){return Math.round(n).toLocaleString(lcl());}
function fmtTime(s){s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return(h>0?h+t("time.h")+" ":"")+(m>0?m+t("time.m")+" ":"")+x+t("time.s");}
function poly(c,x){var e=0;for(var i=0;i<c.length;i++)e+=c[i]*Math.pow(x,i);return e;}
function fileUrl(name,extra){return"/api/fs/file?root="+cur+"&name="+encodeURIComponent(name)+(extra||"");}
async function loadCsrf(){try{var r=await(await fetch("/api/csrf-token")).json();csrfToken=r.token||"";}catch(e){}}

/* ---------- шапка: прибор и батарея (как прочие страницы) ---------- */
async function loadChips(){
 try{
  var r=await(await fetch("/api/system")).json();
  var devChip=document.getElementById("dev-chip"),devDot=document.getElementById("dev-dot"),devStat=document.getElementById("device-chip");
  devChip.style.visibility="";
  if(r.usb_connected){devDot.classList.remove("off");devStat.textContent=t("dev.chipOk");devChip.classList.remove("warn");devChip.classList.add("ok");}
  else{devDot.classList.add("off");devStat.textContent=t("dev.chipOff");devChip.classList.add("warn");devChip.classList.remove("ok");}
  var bc=document.getElementById("batt-chip");
  if(r.batt_present){
   bc.style.display="";
   var bpct=(typeof r.batt_percent==="number")?Math.max(0,Math.min(100,Math.round(r.batt_percent))):0;
   var fillEl=document.getElementById("batt-fill");
   fillEl.style.width=bpct+"%";fillEl.style.background=bpct<20?"#ff8a82":bpct<50?"#f0c45a":"var(--accent)";
   document.getElementById("batt-pct").textContent=(r.batt_charging?"⚡":"")+bpct+"%";
   bc.title="Battery: "+((typeof r.batt_voltage==="number")?r.batt_voltage.toFixed(2)+"V":"")+(r.batt_charging?" · charging":r.batt_chg_done?" · charged":"");
  }else bc.style.display="none";
 }catch(e){}
}
async function loadCalib(){
 try{var r=await(await fetch("/api/device")).json();
 if(r.calibration&&r.calibration.length)calib=r.calibration;
 if(r.serial)document.getElementById("device-chip").title="S/N: "+r.serial;}catch(e){}
}

/* ---------- папки и место ---------- */
async function loadRoots(){
 try{fsInfo=await(await fetch("/api/fs/roots")).json();}catch(e){fsInfo=null;}
 renderTabs(); renderStorage();
}
function rootInfo(id){if(!fsInfo)return null;for(var i=0;i<fsInfo.roots.length;i++)if(fsInfo.roots[i].id===id)return fsInfo.roots[i];return null;}
function setBar(id,used,total){
 var pct=total>0?used/total*100:0, el=document.getElementById(id);
 el.style.width=pct.toFixed(1)+"%"; el.style.background=pct>90?"#ff8a82":pct>70?"#f0c45a":"var(--accent)";
 return pct;
}
function renderStorage(){
 if(!fsInfo)return;

// Пачками: удаление в FAT ищет запись по каталогу с начала — сотни файлов

async function delFiles(list){
 if(!list.length)return;
 var bytes=0; list.forEach(function(f){bytes+=f.s;});
 if(!confirm(list.length===1?tfmt("confirm.del1",list[0].n):tfmt("confirm.delN",list.length,fmtSize(bytes))))return;
 if(!csrfToken)await loadCsrf();
 var info=document.getElementById("selInfo"), fails=[], done=0, B=20;
 document.getElementById("btnDelSel").disabled=true;
 for(var i=0;i<list.length;i+=B){
  var part=list.slice(i,i+B).map(function(f){return f.n;});
  info.textContent=tfmt("del.prog",i,list.length);
  try{
   var r=await fetch("/api/fs/delete?root="+cur,{method:"POST",headers:{"X-CSRF-Token":csrfToken,"Content-Type":"text/plain"},body:part.join("\n")});
   if(!r.ok)throw new Error("HTTP "+r.status);
   var j=await r.json(); done+=j.ok; fails=fails.concat(j.fail||[]);
  }catch(e){part.forEach(function(n){fails.push([n,String(e.message||e)]);});}
 }
 fails.forEach(function(x){delete sel[x[0]];});
 list.forEach(function(f){delete sel[f.n];});
 if(pv&&list.some(function(f){return f.n===pv.name;})&&!fails.some(function(x){return x[0]===pv.name;}))clearPreview();

  var why={busy:t("del.busy"),notfound:t("del.notfound"),io:t("del.io"),badname:t("del.badname")};
  alert(tfmt("del.fail",fails.length,list.length)+"\n"+fails.slice(0,15).map(function(x){return x[0]+" — "+(why[x[1]]||x[1]);}).join("\n")+(fails.length>15?"\n…":""));
 }
}

function showText(f,buf,note){

  for(var o=0;o<n;o+=16){

   s+=("0000"+o.toString(16)).slice(-5)+"  "+(hx+"                                                ").slice(0,48)+" "+as+"\n";

function drawSpectrum(bins,cal){
 var C=document.getElementById("pvc"), X=C.getContext("2d");
 var W=C.width,H=C.height,PL=60,PT=12,PR=W-12,PB=H-36,PW=PR-PL,PH=PB-PT;
 X.fillStyle="#0c0f0b";X.fillRect(0,0,W,H);
 if(!bins||!bins.length){X.fillStyle="#5b655a";X.font="14px ui-monospace,monospace";X.textAlign="center";X.fillText(t("no_data"),W/2,H/2);return;}
 var N=bins.length, mx=0; for(var i=0;i<N;i++)if(bins[i]>mx)mx=bins[i]; if(mx<=0)mx=1;

/* --- мониторинг: CSV сессии (sd_log.c / «Выгрузить CSV» monitor.html) --- */
function viewMonitorCsv(f,txt){
 var lines=txt.split(/\r?\n/), pts=[], started="", counts=0, dur=0, mn=Infinity, mx=-Infinity;
 lines.forEach(function(l){
  if(l.charAt(0)==="#"){var m=l.match(/started (.+?)\s{2}/);if(m)started=m[1];return;}
  var p=l.split(";"); if(p.length<6||p[0]==="timestamp")return;
  var d=+p[3],c=+p[4],cps=+p[5]; if(!isFinite(cps))return;
  pts.push({ts:p[0],end:+p[2],cps:cps}); counts+=c||0; dur+=d||0; if(cps<mn)mn=cps; if(cps>mx)mx=cps;
 });
 body(canvasHtml(320)); drawMonitor(pts);
 setMeta([["m.started",started||(pts.length?pts[0].ts:"—")],["m.intervals",fmtNum(pts.length)],["m.dur",dur?fmtTime(dur):"—"],
  ["m.counts",fmtNum(counts)],["m.mean",dur>0?(counts/dur).toFixed(3):"—"],["m.minmax",pts.length?mn.toFixed(2)+" / "+mx.toFixed(2):"—"],
  ["m.size",fmtSize(f.s)],["m.date",fmtDate(f.t)]]);
}
function drawMonitor(pts){
 var C=document.getElementById("pvc"),X=C.getContext("2d"),W=C.width,H=C.height,PL=60,PT=12,PR=W-12,PB=H-36,PW=PR-PL,PH=PB-PT;
 X.fillStyle="#0c0f0b";X.fillRect(0,0,W,H);
 if(pts.length<1){X.fillStyle="#5b655a";X.font="14px ui-monospace,monospace";X.textAlign="center";X.fillText(t("no_data"),W/2,H/2);return;}
 var lo=Infinity,hi=-Infinity; pts.forEach(function(p){if(p.cps<lo)lo=p.cps;if(p.cps>hi)hi=p.cps;});
 var pad=(hi-lo)*0.08||Math.max(hi*0.05,1); lo=Math.max(0,lo-pad); hi+=pad;
 function yM(v){return PB-(v-lo)/(hi-lo)*PH;}
 X.font="10px ui-monospace,monospace";X.textAlign="right";
 for(var i=0;i<=5;i++){var v=lo+(hi-lo)*i/5,y=yM(v);X.strokeStyle="rgba(255,255,255,.05)";X.beginPath();X.moveTo(PL,y);X.lineTo(PR,y);X.stroke();
  X.fillStyle="#5a645a";X.fillText(v<10?v.toFixed(2):v.toFixed(0),PL-5,y+3);}
 var n=pts.length, xs=function(i){return PL+(n>1?i/(n-1):0.5)*PW;};
 var accent=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#34d3c0";
 X.save();X.beginPath();X.rect(PL,PT,PW,PH);X.clip();
 X.strokeStyle=accent;X.lineWidth=1.4;X.beginPath();
 for(i=0;i<n;i++){var px=xs(i),py=yM(pts[i].cps);i?X.lineTo(px,py):X.moveTo(px,py);} X.stroke(); X.restore();
 X.strokeStyle="#283024";X.lineWidth=1;X.strokeRect(PL+.5,PT+.5,PW,PH);
 X.fillStyle="#6b756a";X.textAlign="center";
 for(i=0;i<=4;i++){var k=Math.round(i/4*(n-1)),lab=pts[k].ts?pts[k].ts.slice(11,19):String(pts[k].end)+"s";X.fillText(lab,xs(k),PB+15);}
 X.fillStyle="#5a645a";X.fillText(t("ax.cps")+" / "+t("ax.time"),PL+PW/2,PB+30);
}

/* --- водопад: сегмент .aswf ("ASWF" + u32 длина шапки + JSON, baseline, строки) --- */
var INFERNO=[[0,0,4],[20,11,52],[58,9,99],[101,21,110],[143,36,108],[185,53,95],[222,73,74],[247,104,52],[252,143,30],[252,194,72]];

function viewAswf(f,ab){
 var dv=new DataView(ab);
 if(ab.byteLength<8||String.fromCharCode(dv.getUint8(0),dv.getUint8(1),dv.getUint8(2),dv.getUint8(3))!=="ASWF"){showText(f,ab.slice(0,8192),"");return;}
 var hl=dv.getUint32(4,true), H=JSON.parse(new TextDecoder().decode(new Uint8Array(ab,8,Math.min(hl,ab.byteLength-8))).trim());
 var ch=H.channels||8192, stride=H.row_stride||ch*2;
 var base=8+hl+(H.baseline?(H.baseline.channels||ch)*4:0);
 var nr=Math.max(0,Math.floor((ab.byteLength-base)/stride));
 var off={}; (H.row_fields||[]).forEach(function(x){off[x.name]=x.offset;});
 // последний канал с данными — ось по нему (обычно до ~3 МэВ из 8192)
 var colSum=new Float64Array(ch), tsA=[], durA=[], total=0;
 for(var r=0;r<nr;r++){var o=base+r*stride;
  for(var c=0;c<ch;c++){var v=dv.getUint16(o+c*2,true);colSum[c]+=v;}
  if(off.timestamp!==undefined)tsA.push(dv.getUint32(o+off.timestamp,true));
  if(off.duration!==undefined)durA.push(dv.getUint16(o+off.duration,true));}
 var hiCh=0; for(c=ch-1;c>0;c--)if(colSum[c]>0){hiCh=c;break;}
 for(c=0;c<ch;c++)total+=colSum[c];
 var span=Math.min(ch,Math.max(256,Math.ceil((hiCh+1)*1.05/64)*64));
 var W=900, rowH=nr?Math.max(1,Math.min(8,Math.floor(400/nr))):1, ih=Math.min(600,Math.max(nr*rowH,40)), PB=ih, Htot=ih+36;
 body(canvasHtml(Htot));
 var C=document.getElementById("pvc"),X=C.getContext("2d");
 X.fillStyle="#0c0f0b";X.fillRect(0,0,W,Htot);
 if(nr){
  var vals=new Float32Array(W*nr), mx=1;
  for(r=0;r<nr;r++){o=base+r*stride;
   for(var x=0;x<W;x++){var a=Math.floor(x*span/W),b=Math.max(a+1,Math.floor((x+1)*span/W)),m=0;
    for(c=a;c<b;c++){v=dv.getUint16(o+c*2,true);if(v>m)m=v;}
    vals[r*W+x]=m; if(m>mx)mx=m;}}
  var img=X.createImageData(W,ih), D=img.data, lm=Math.log1p(mx);
  for(var y=0;y<ih;y++){var rr=nr-1-Math.min(nr-1,Math.floor(y*nr/ih));   // новейшая строка сверху, как на «Водопаде»
   for(x=0;x<W;x++){var col=cmap(Math.log1p(vals[rr*W+x])/lm),p=(y*W+x)*4;D[p]=col[0];D[p+1]=col[1];D[p+2]=col[2];D[p+3]=255;}}
  X.putImageData(img,0,0);
 }
 xAxis(X,0,W,PB,span,H.calibration&&H.calibration.length?H.calibration:null);
 var ivl=H.interval_sec, sumDur=0; durA.forEach(function(d){sumDur+=d;});
 var t0=tsA.length?tsA[0]:0, t1=tsA.length?tsA[tsA.length-1]:0;
 setMeta([["m.rows",fmtNum(nr)],["m.interval",ivl?ivl+" "+t("time.s"):"—"],["m.from",t0>1e9?fmtDate(t0):"—"],["m.to",t1>1e9?fmtDate(t1):"—"],
  ["m.dur",sumDur?fmtTime(sumDur):"—"],["m.total",fmtNum(total)],["m.cps",sumDur>0?(total/sumDur).toFixed(2):"—"],
  ["m.ver","ASWF v"+(H.version||1)],H.seg_seq!==undefined?["m.seq",H.seg_seq]:null,H.serial?["m.serial",H.serial]:null,
  ["m.cal",H.calibration&&H.calibration.length?tfmt("cal.set",H.calibration.length):t("cal.unset")],["m.size",fmtSize(f.s)]]);
 if(f.n===busyName)document.getElementById("pv-body").insertAdjacentHTML("afterbegin",'<div class="note" style="padding:0 0 8px">'+esc(t("pv.partial"))+'</div>');
}

 setInterval(loadChips,10000);
})();
</script>
